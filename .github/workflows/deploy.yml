name: deploy

# Prod + PR-preview deploys via the Alchemy root action
# (`alchemy-run/alchemy@main`): a pull request deploys `staging-<pr>`, the main
# branch deploys `prod`, and a closed pull request destroys its preview.
#
# DISABLED — `workflow_dispatch` only. The action deploys and destroys in
# DIFFERENT workflow runs, so a PR-opened deploy and its PR-closed destroy never
# share a runner. With `Alchemy.localState()` the destroy run sees no state,
# plans "0 to delete", and leaks every resource of the preview. The store must
# be the account-wide `Cloudflare.state()`; that path is prepared behind the
# `REMOTE_STATE` switch in `alchemy.run.ts` (default local), and the same flag
# is read by `test/api.test.ts` / `e2e/stack.test.ts`, so a deploy and a destroy
# can never diverge into two stores.
#
# Enable in this order — every step is required:
#
#  1. Bootstrap the state store ONCE, from a profile whose credential carries
#     `Workers Scripts Write` + `Secrets Store Write` (it deploys the
#     `alchemy-state-store` Worker and creates the account Secrets Store, then
#     reads the bearer token back through an edge-preview binding):
#
#         alchemy provider cloudflare bootstrap
#
#     On the pinned beta.83 that is the only bootstrap form —
#     `alchemy state bootstrap --backend cloudflare` is beta.84 (see
#     MIGRATION-beta84.md §"State store commands").
#
#  2. Re-mint the CI token WITH `Secrets Store Write`. The permission was added
#     to `stacks/github.ts`; it takes effect only when the token is recreated,
#     because `Cloudflare.state()` reads the state-store token back through a
#     Secrets Store *binding* on every CI run, and binding needs Write — Read
#     only enumerates the store. From an `admin` profile:
#
#         alchemy deploy --config stacks/github.ts --profile admin
#
#  3. Select the remote store for THIS job only. Add to the `deploy` job `env`
#     below, so both the deploy and the destroy run against the shared store
#     while `e2e.yml` keeps its self-contained local state:
#
#         ALCHEMY_REMOTE_STATE: "1"
#
#  4. Enable the real triggers by replacing the `on:` block below with:
#
#         on:
#           push:
#             branches: [main]
#           pull_request:
#             types: [opened, reopened, synchronize, closed]
#           workflow_dispatch:
#
# `src/Db.ts` / `src/Photos.ts` already treat `staging-*` as ephemeral
# (`retain(!stage.startsWith("test_") && !stage.startsWith("staging-"))`), so a
# PR preview destroys cleanly once this is on.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same as the docs' CI guide — never cancel a deploy mid-flight.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy or destroy a stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '7a470541a704caaf91e71efccc78fd36' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Deploying the Stack resolves Config.Redacted("ADMIN_TOKEN").
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.28.5"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The action shells out to a bare `alchemy`; GitHub only puts
      # node_modules/.bin on PATH inside `pnpm run`, so add it explicitly (the
      # README's "install the CLI before this action runs").
      - name: Put the CLI on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # A `secrets.*` expression cannot appear in `if:` (GitHub rejects it), so
      # presence is tested in a step — same shape as ci.yml / e2e.yml. A fork
      # has no secrets, so this skips with a notice rather than failing.
      - name: Check for credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$ADMIN_TOKEN" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_API_TOKEN/ADMIN_TOKEN secret; skipping the deploy."
          fi

      - if: steps.creds.outputs.proceed == 'true'
        uses: alchemy-run/alchemy@main
