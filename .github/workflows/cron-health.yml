name: cron health

# The scheduler is external and invisible from inside the Worker: on 2026-10-23
# the live script kept delivering a RETIRED `* * * * *` after the schedule had
# changed. Nothing in the repo could see it. This job asks the platform what it
# actually delivered and compares it with what we configured (CRON-FINDINGS.md).
#
# Every 6 hours rather than daily: the assertion gates on the NEWEST delivery, so
# a more frequent run narrows the window in which a one-off replay could hide.
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivered-vs-configured:
    name: delivered expression matches configured
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '7a470541a704caaf91e71efccc78fd36' }}
      ALCHEMY_STAGE: ${{ vars.CLOUDFLARE_STAGE || 'deep-pass' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.28.5"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check for CLOUDFLARE_API_TOKEN
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_API_TOKEN secret; skipping the cron health check."
          fi

      - name: Install dependencies
        if: steps.creds.outputs.proceed == 'true'
        # `scripts/cron-health.ts` imports `alchemy/Cli/Format` for its timestamps
        # (the canonical formatter — see CONVENTIONS), so this job installs first.
        run: pnpm install --frozen-lockfile

      - name: Assert delivered cron matches configured
        if: steps.creds.outputs.proceed == 'true'
        # The Worker's physical name is engine-generated (`…-<hash>`) and lives in
        # gitignored .alchemy state, so CI cannot derive it — set the repo variable
        # CLOUDFLARE_WORKER_NAME (the deploy prints it). A hard-coded name would rot
        # the moment the stage is recreated.
        run: |
          if [ -z "$WORKER_NAME" ]; then
            echo "::notice::CLOUDFLARE_WORKER_NAME is not set; skipping (the deploy prints the Worker name)."
            exit 0
          fi
          node scripts/cron-health.ts --worker "$WORKER_NAME"
        env:
          WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}

      # The audit found the dead-letter queue is a silent sink: a poison message is
      # parked after maxRetries with nothing draining or alerting it. This is the
      # invariant that fails loudly — see AUDIT-2026-10-23.md.
      - name: Assert the dead-letter queue is empty
        if: steps.creds.outputs.proceed == 'true'
        # The account id and token come from the job-level env.
        run: node scripts/queue-health.ts
